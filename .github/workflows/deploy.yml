# Publica o Lockerdex no GitHub Pages.
# - A cada push na main.
# - A cada 3 horas: confere o fortnite.gg e, se saíram elementais novos, atualiza os dados, traduz nome e
#   habilidade nos 22 idiomas (Gemini, com a chave gratuita no segredo GEMINI_API_KEY; sem ela, o Google
#   Tradutor sem chave, só a habilidade) e publica sozinho.
# - Todo dia às 06:15 UTC (depois da troca da loja às 00:00): recria o catálogo de cosméticos
#   com o histórico de loja do dia antes do build.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
    - cron: "40 */3 * * *"
    # Os jogos grátis da Epic trocam às quintas, 15:00 UTC (12h em Brasília)
    - cron: "20 15 * * 4"
  workflow_dispatch:
    inputs:
      testar_tradutor:
        description: "Só testar o acesso aos tradutores (Gemini e Google Tradutor)"
        type: boolean
        default: false

permissions:
  contents: write # commits do robô: elementais novos e o commit vazio que mantém o agendamento vivo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O GitHub desliga agendamentos de repositórios públicos após 60 dias sem commit.
      # Se o último commit tiver mais de 45 dias, registra um commit vazio para seguir rodando.
      - name: Manter a atualização diária ativa
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter a atualização diária ativa"
            git push
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # O feed da Epic não libera CORS: o site lê o arquivo gerado aqui. Se a Epic estiver fora do ar,
      # segue com o arquivo do repositório (a página filtra pelas datas).
      # Elementais novos: baixa o catálogo do fortnite.gg, refaz seasons.json e os ícones e guarda no repositório.
      # Se o fortnite.gg bloquear o GitHub ou mudar algo já conhecido, o passo falha só com aviso e o site
      # segue com os dados que já estão no repositório. data/raw não vai para o git: o cache evita rebaixar tudo.
      - name: Cache do fortnite.gg
        if: github.event_name != 'push'
        uses: actions/cache@v5
        with:
          path: data/raw
          key: fgg-raw-${{ github.run_id }}
          restore-keys: fgg-raw-

      - name: Testar o tradutor
        if: inputs.testar_tradutor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python data/translate_sprites.py --check

      - name: Sincronizar elementais do fortnite.gg
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data/raw
          python data/sync_fgg.py && python data/build_data.py && python data/fetch_icons.py || echo "::warning::não consegui sincronizar com o fortnite.gg; usando os dados do repositório"
          python data/translate_sprites.py || echo "::warning::o tradutor falhou; os elementais novos ficam com o nome em inglês até a próxima execução"
          if ! git diff --quiet -- src/data/seasons.json src/i18n/locales || [ -n "$(git ls-files -o --exclude-standard public/icons)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/seasons.json src/i18n/locales public/icons
            git commit -m "Elementais novos do fortnite.gg (atualização automática)"
            git push
          fi

      - name: Atualizar jogos grátis da Epic
        run: python data/build_free_games.py || echo "::warning::feed da Epic indisponível; usando o arquivo do repositório"

      - name: Atualizar catálogo de cosméticos
        if: github.event_name != 'push'
        run: python data/build_cosmetics.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
