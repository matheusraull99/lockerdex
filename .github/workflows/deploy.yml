# Publica o Lockerdex no GitHub Pages.
# - A cada push na main.
# - Todo dia às 06:15 UTC (depois da troca da loja às 00:00): recria o catálogo de cosméticos
#   com o histórico de loja do dia antes do build.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write # só para o commit vazio que mantém o agendamento vivo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O GitHub desliga agendamentos de repositórios públicos após 60 dias sem commit.
      # Se o último commit tiver mais de 45 dias, registra um commit vazio para seguir rodando.
      - name: Manter a atualização diária ativa
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter a atualização diária ativa"
            git push
          fi

      - uses: actions/setup-python@v7
        if: github.event_name != 'push'
        with:
          python-version: "3.13"

      - name: Atualizar catálogo de cosméticos
        if: github.event_name != 'push'
        run: python data/build_cosmetics.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
