<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- No build, o bloco entre os marcadores vira o título, a descrição, o link canônico,
         as versões por idioma (hreflang) e a prévia de link (Open Graph) de cada página. -->
    <!--seo:start-->
    <title>Lockerdex — sua coleção de Fortnite, estilo álbum</title>
    <meta name="description" content="Sua coleção de Fortnite com cara de álbum de figurinhas: elementais (sprites), loja do dia, cosméticos, lista de desejos, armário, Jam Tracks e mapa. Em 22 idiomas, sem anúncios, funciona offline e instala como app." />
    <!--seo:end-->
    <meta name="theme-color" content="#eceff8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110d24" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lockerdex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      // Cor do site escolhida (src/lib/theme.ts): entra antes de a página aparecer, sem piscar a padrão.
      try {
        var t = JSON.parse(localStorage.getItem("lockerdex:theme") || "null");
        if (t && t.css) {
          var s = document.createElement("style");
          s.id = "lockerdex-theme";
          s.textContent = t.css;
          document.head.appendChild(s);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.dataset.default = m.content;
            if (t.bar) m.content = /dark/.test(m.media) ? t.bar[1] : t.bar[0];
          });
        }
      } catch (e) {}
    </script>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
